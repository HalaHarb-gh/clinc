<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Premium Pink-Red Gradient for Heart -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <!-- Premium Blue Gradient for Cross -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Modern Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Medical Cross -->
    <!-- Vertical Arm -->
    <rect x="71" y="18" width="18" height="54" rx="6" fill="url(#crossGrad)" />
    <!-- Horizontal Arm -->
    <rect x="53" y="36" width="54" height="18" rx="6" fill="url(#crossGrad)" />
    
    <!-- Elegant Heart -->
    <path d="M 45 85 C 45 85 10 50 10 30 C 10 15 30 10 45 25 C 60 10 80 15 80 30 C 80 50 45 85 45 85 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Glowing White ECG Line -->
  <!-- A subtle dark shadow under the line to make it pop -->
  <path d="M 5 50 L 22 50 L 30 35 L 40 75 L 52 18 L 60 50 L 95 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));" />
  
  <!-- Sleek dots at the ends of the ECG line -->
  <circle cx="95" cy="50" r="3.5" fill="#ffffff" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));" />
  <circle cx="5" cy="50" r="3.5" fill="#ffffff" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));" />
</svg>
